<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advanced Loan Calculator</title>
<style>
  :root {
    --primary-color: #4a90e2;
    --secondary-color: #f5f7fa;
    --accent-color: #e94e77;
    --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--secondary-color);
    font-family: var(--font-family);
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
  }
  .loan-calculator {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    max-width: 480px;
    width: 100%;
    padding: 2.5rem 3rem;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }
  .loan-calculator h1 {
    margin: 0 0 1rem;
    color: var(--primary-color);
    font-weight: 700;
    font-size: 2rem;
    text-align: center;
  }
  label {
    font-weight: 600;
    color: #333;
    display: block;
    margin-bottom: 0.5rem;
  }
  input[type=number], input[type=text], select {
    width: 100%;
    padding: 0.65rem 1rem;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }
  input[type=number]:focus, input[type=text]:focus, select:focus {
    border-color: var(--primary-color);
    outline: none;
  }
  .range-input {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .range-input input[type=range] {
    flex-grow: 1;
    -webkit-appearance: none;
    height: 8px;
    border-radius: 8px;
    background: linear-gradient(to right, var(--primary-color) 0%, var(--primary-color) 50%, #ddd 50%, #ddd 100%);
    outline: none;
    transition: background 0.3s ease;
  }
  .range-input input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    background: var(--accent-color);
    cursor: pointer;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    border: none;
    transition: background 0.3s ease;
  }
  .range-input input[type=range]:hover::-webkit-slider-thumb {
    background: #d1375d;
  }
  .range-value {
    min-width: 48px;
    text-align: center;
    font-weight: 700;
    color: var(--primary-color);
    user-select: none;
  }
  button {
    background: var(--primary-color);
    color: #fff;
    border: none;
    padding: 0.85rem;
    font-weight: 700;
    font-size: 1.2rem;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s ease;
    box-shadow: 0 6px 12px rgba(74,144,226,0.5);
  }
  button:hover {
    background: #357ABD;
  }
  .results {
    background: var(--secondary-color);
    border-radius: 12px;
    padding: 1.5rem;
    color: #222;
    font-weight: 600;
    user-select: none;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
  }
  .result-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.8rem;
    font-size: 1.1rem;
  }
  .result-item:last-child {
    margin-bottom: 0;
  }
  .error-message {
    background: #ff4e42;
    color: #fff;
    padding: 0.8rem 1rem;
    border-radius: 8px;
    font-weight: 700;
    text-align: center;
    user-select: none;
  }
  @media (max-width: 520px) {
    .loan-calculator {
      padding: 2rem 1.5rem;
    }
  }
</style>
</head>
<body>
  <form class="loan-calculator" novalidate>
    <h1>Advanced Loan Calculator</h1>
    <div>
      <label for="principal">Loan Amount ($)</label>
      <input type="number" id="principal" name="principal" min="0" step="100" placeholder="e.g. 25000" required />
    </div>
    <div>
      <label for="interest">Annual Interest Rate (%)</label>
      <div class="range-input">
        <input type="range" id="interest" name="interest" min="0" max="25" step="0.01" value="5" />
        <div class="range-value" id="interest-value">5.00%</div>
      </div>
    </div>
    <div>
      <label for="term">Loan Term</label>
      <select id="term-unit" name="term-unit" aria-label="Select term unit">
        <option value="years" selected>Years</option>
        <option value="months">Months</option>
      </select>
      <input type="number" id="term" name="term" min="1" step="1" value="5" aria-label="Enter loan term" required style="margin-top:0.5rem;" />
    </div>
    <div>
      <label for="payments-per-year">Payments Per Year</label>
      <select id="payments-per-year" name="payments-per-year" aria-label="Select number of payments per year">
        <option value="12" selected>Monthly (12)</option>
        <option value="26">Bi-Weekly (26)</option>
        <option value="52">Weekly (52)</option>
        <option value="4">Quarterly (4)</option>
        <option value="1">Annually (1)</option>
      </select>
    </div>
    <button type="submit" aria-label="Calculate loan payments">Calculate</button>
    <div class="error-message" id="error" role="alert" style="display:none;"></div>
    <div class="results" id="results" aria-live="polite" style="display:none;">
      <div class="result-item"><span>Payment per Period:</span><span id="payment"></span></div>
      <div class="result-item"><span>Total Payments:</span><span id="total-payments"></span></div>
      <div class="result-item"><span>Total Interest:</span><span id="total-interest"></span></div>
      <div class="result-item"><span>Total Cost of Loan:</span><span id="total-cost"></span></div>
    </div>
  </form>
<script>
  (() => {
    // Cached DOM elements for performance
    const form = document.querySelector('.loan-calculator');
    const principalInput = form.principal;
    const interestRange = form.interest;
    const interestValueDisplay = document.getElementById('interest-value');
    const termInput = form.term;
    const termUnitSelect = form['term-unit'];
    const paymentsPerYearSelect = form['payments-per-year'];
    const errorDiv = document.getElementById('error');
    const resultsDiv = document.getElementById('results');
    const paymentDisplay = document.getElementById('payment');
    const totalPaymentsDisplay = document.getElementById('total-payments');
    const totalInterestDisplay = document.getElementById('total-interest');
    const totalCostDisplay = document.getElementById('total-cost');

    // Format number as currency string
    function formatCurrency(num) {
      return num.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
    }

    // Update interest range background fill and value display
    function updateInterestUI(value) {
      interestValueDisplay.textContent = `${parseFloat(value).toFixed(2)}%`;
      // Calculate fill percentage for gradient background
      const max = +interestRange.max;
      const percent = (value / max) * 100;
      interestRange.style.background = `linear-gradient(to right, var(--primary-color) 0%, var(--primary-color) ${percent}%, #ddd ${percent}%, #ddd 100%)`;
    }

    // Calculate loan payment details using amortization formula
    // P = principal, r = periodic interest rate, n = total number of payments
    function calculateLoan(principal, annualInterest, termCount, termUnit, paymentsPerYear) {
      if (principal <= 0 || annualInterest < 0 || termCount <= 0 || paymentsPerYear <= 0) return null;

      // Convert term to number of payments based on unit and payments per year
      let totalPayments = termUnit === 'years' ? termCount * paymentsPerYear : termCount;
      // Convert annual interest rate percentage to periodic decimal rate
      let periodicInterestRate = annualInterest / 100 / paymentsPerYear;

      // If interest rate is 0, payment is principal / totalPayments
      let payment;
      if (periodicInterestRate === 0) {
        payment = principal / totalPayments;
      } else {
        // Amortization formula
        payment = principal * (periodicInterestRate * Math.pow(1 + periodicInterestRate, totalPayments)) / (Math.pow(1 + periodicInterestRate, totalPayments) - 1);
      }

      const totalPaid = payment * totalPayments;
      const totalInterest = totalPaid - principal;

      return {
        payment,
        totalPayments,
        totalInterest,
        totalPaid
      };
    }

    // Validate inputs with detailed error messages
    function validateInputs(principal, interest, term, paymentsPerYear) {
      if (isNaN(principal) || principal <= 0) return 'Loan amount must be a positive number.';
      if (isNaN(interest) || interest < 0 || interest > 25) return 'Interest rate must be between 0% and 25%.';
      if (isNaN(term) || term <= 0 || !Number.isInteger(term)) return 'Loan term must be a positive integer.';
      if (isNaN(paymentsPerYear) || paymentsPerYear <= 0) return 'Payments per year must be a positive number.';
      return null;
    }

    // Render results on UI
    function renderResults({ payment, totalPayments, totalInterest, totalPaid }) {
      paymentDisplay.textContent = formatCurrency(payment);
      totalPaymentsDisplay.textContent = totalPayments.toLocaleString();
      totalInterestDisplay.textContent = formatCurrency(totalInterest);
      totalCostDisplay.textContent = formatCurrency(totalPaid);
      resultsDiv.style.display = 'block';
    }

    // Hide error and results containers
    function resetUI() {
      errorDiv.style.display = 'none';
      resultsDiv.style.display = 'none';
      errorDiv.textContent = '';
    }

    // Event listener for interest range input to update UI dynamically
    interestRange.addEventListener('input', e => {
      updateInterestUI(e.target.value);
    });

    // Initialize interest UI on load
    updateInterestUI(interestRange.value);

    // Form submission handler
    form.addEventListener('submit', e => {
      e.preventDefault();
      resetUI();

      const principal = parseFloat(principalInput.value);
      const interest = parseFloat(interestRange.value);
      const term = parseInt(termInput.value, 10);
      const termUnit = termUnitSelect.value;
      const paymentsPerYear = parseInt(paymentsPerYearSelect.value, 10);

      const validationError = validateInputs(principal, interest, term, paymentsPerYear);
      if (validationError) {
        errorDiv.textContent = validationError;
        errorDiv.style.display = 'block';
        return;
      }

      const loanData = calculateLoan(principal, interest, term, termUnit, paymentsPerYear);
      if (!loanData) {
        errorDiv.textContent = 'Calculation error. Check input values.';
        errorDiv.style.display = 'block';
        return;
      }

      renderResults(loanData);
    });
  })();
</script>
</body>
</html>
